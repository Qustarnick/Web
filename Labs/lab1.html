<html lang="ru">
<head>
    <meta charset="UTF-8">
</head>
<body>
    <p>
        Заполните пропуски в HTML-коде:
    </p>
    <p>
        &lt;form&gt;
        <br />&emsp;&lt;p&gt;
        <br />&emsp;&emsp;&lt;input type="text" value="STEPIK.ORG"
        <label><input type="radio" name="properties" value="0" />readonly</label>
        <label><input type="radio" name="properties" value="1" />disabled</label>
        <label><input type="radio" name="properties" value="2" />selected</label>&gt;
        <br />&emsp;&lt;/p&gt;
        <br />&emsp;&lt;p&gt;
        <br />&emsp;&emsp;&lt;input type="text" <input type="text" />="Введите логин"&gt;
        <br />&emsp;&lt;/p&gt;
        <br />&emsp;&lt;p&gt;
        <br />&emsp;&emsp;&lt;input type="<select name="select">
            <option value="0">text</option>
            <option value="1">password</option>
        </select>" <input type="text" />="Введите пароль"&gt;
        <br />&emsp;&lt;/p&gt;
        <br />&lt;/form&gt;
    </p>

    <p><i>Результат:</i></p>

    <form>
        <p>
            <input type="text" value="STEPIK.ORG" disabled>
        </p>
        <p>
            <input type="text" placeholder="Введите логин">
        </p>
        <p>
            <input type="password" placeholder="Введите пароль">
        </p>
        <p>
            <input type="submit" value="Отправить">
        </p>
    </form>
</body>
</html>
